# Fork build: compiles OpenKJ for macOS on every push and publishes a GitHub release
# when a version tag (e.g. 1.2.3) is pushed.  Based on the upstream macOS workflow, with
# the Apple code signing and openkj.org upload steps removed, so the output is unsigned.
name: Fork macOS Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fork macOS Build
    # Pinned rather than macos-latest: the Xcode 21 toolchain on the current image
    # rejects the consteval usage in the fmt version vendored with spdlog 1.9.2.
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: lukka/get-cmake@latest

    - name: Get version from git tag
      id: get_version
      uses: dhkatz/get-version-action@v3.0.0

    - name: Get OpenKJ version being buit
      run: |
        if [ "${{ steps.get_version.outputs.prerelease }}" = "" ];then
          RTYPE="release"
          BRANCH="release"
        elif [ "${{ steps.get_version.outputs.prerelease }}" = "unstable" ];then
          RTYPE="unstable"
          BRANCH="unstable"
        else
          RTYPE=${{ steps.get_version.outputs.prerelease }}
          BRANCH="unstable"
        fi
        OKJVER=${{ steps.get_version.outputs.version-without-v }}
        FN="OpenKJ-${OKJVER}-osx-installer.pkg"
        echo "installer_fn=${FN}" >> $GITHUB_ENV
        echo "rtype=${RTYPE}" >> $GITHUB_ENV
        echo "branch=${BRANCH}" >> $GITHUB_ENV

    - name: Update files with new version info
      if: steps.get_version.outputs.is-semver == 'true'
      run: |
        MAJOR=${{ steps.get_version.outputs.major }}
        MINOR=${{ steps.get_version.outputs.minor }}
        PATCH=${{ steps.get_version.outputs.patch }}
        BRANCH=${{ env.rtype }}

        echo "Updating okjversion.h"
        echo "#ifndef OKJVERSION_H" > src/okjversion.h
        echo "#define OKJVERSION_H" >> src/okjversion.h
        echo >> src/okjversion.h
        echo "#define OKJ_VERSION_MAJOR ${{ steps.get_version.outputs.major }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_MINOR ${{ steps.get_version.outputs.minor }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_BUILD ${{ steps.get_version.outputs.patch }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_STRING \"${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}.${{ steps.get_version.outputs.patch }}\"" >> src/okjversion.h
        echo "#define OKJ_VERSION_BRANCH \"${{ env.rtype }}\"" >> src/okjversion.h
        echo >> src/okjversion.h
        echo "#endif //OKJVERSION_H" >> src/okjversion.h
      shell: bash

    - name: install deps
      run: |
        brew install cmake ninja pkgconf cppunit utf8cpp qt@5

    # The osxrelocator package on PyPI is Python 2 only and won't run under the runner's
    # Python 3, so use the small equivalent kept in .github/scripts instead.
    - name: Install osxrelocator replacement
      run: |
        sudo install -m 0755 .github/scripts/osxrelocator /usr/local/bin/osxrelocator
        osxrelocator 2>&1 | head -1 || true

    # Build against GStreamer's own macOS framework rather than the Homebrew formula, so the
    # framework can be copied into the .app and the result runs on Macs without GStreamer.
    - name: Install GStreamer framework
      env:
        GST_VERSION: '1.28.7'
      run: |
        curl -sSfL -o gstreamer.pkg "https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}/gstreamer-1.0-${GST_VERSION}-universal.pkg"
        curl -sSfL -o gstreamer-devel.pkg "https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}/gstreamer-1.0-devel-${GST_VERSION}-universal.pkg"
        sudo installer -pkg gstreamer.pkg -target /
        sudo installer -pkg gstreamer-devel.pkg -target /
        ls -l /Library/Frameworks/GStreamer.framework/Versions/

    # The build copies GStreamer.framework.dist into the bundle.  Make that copy here, without
    # the development files, so the shipped app stays a reasonable size.
    - name: Prepare GStreamer framework copy for bundling
      run: |
        sudo cp -R /Library/Frameworks/GStreamer.framework /Library/Frameworks/GStreamer.framework.dist
        du -sh /Library/Frameworks/GStreamer.framework.dist
        # Only drop things nothing loads at runtime.  Headers stay: deleting them leaves the
        # framework's root symlinks dangling, which makes codesign reject the bundle.
        sudo find /Library/Frameworks/GStreamer.framework.dist -name '*.a' -delete
        sudo find /Library/Frameworks/GStreamer.framework.dist -name '*.la' -delete
        sudo rm -rf /Library/Frameworks/GStreamer.framework.dist/Versions/1.0/share/gtk-doc
        sudo rm -rf /Library/Frameworks/GStreamer.framework.dist/Versions/1.0/share/man
        du -sh /Library/Frameworks/GStreamer.framework.dist

    - name: Build
      env:
        LDFLAGS: "-L/opt/homebrew/opt/qt@5/lib"
        CPPFLAGS: "-I/opt/homebrew/opt/qt@5/include"
        PKG_CONFIG_PATH: "/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig:/opt/homebrew/opt/qt@5/lib/pkgconfig"
        QT_DIR: "/opt/homebrew/opt/qt@5/"
        Qt5_DIR: "/opt/homebrew/opt/qt@5/"
      run: |
        cmake -DSPDLOG_USE_BUNDLED=true -DCMAKE_BUILD_TYPE=Release -DBUNDLE_GSTREAMER=True . -B build -G Ninja
        ninja -C build

    # Rewriting Mach-O headers invalidates code signatures, and macOS on Apple Silicon won't run
    # a binary whose signature doesn't match.  install_name_tool re-signs each file it touches,
    # so this only re-seals the bundles.  Signing the embedded framework as its own unit first
    # mirrors what the upstream signed build does; --deep can't handle its layout.
    - name: Ad-hoc sign the app bundle
      working-directory: ${{github.workspace}}/build
      continue-on-error: true
      run: |
        codesign --force --sign - --identifier org.freedesktop.gstreamer openkj.app/Contents/Frameworks/GStreamer.framework
        codesign --force --sign - --identifier org.openkj.openkj openkj.app
        codesign --verify --verbose openkj.app

    - name: Upload app
      uses: actions/upload-artifact@v4
      with:
        path: build/openkj.app
        name: openkj.app

    - name: Create installer
      working-directory: ${{github.workspace}}/build
      run: |
        mkdir -p fakeroot/Applications
        mv "openkj.app" fakeroot/Applications/OpenKJ.app
        pkgbuild --root "fakeroot" --component-plist ../macos/openkj.plist --identifier "org.openkj.openkj" ${{ env.installer_fn }}

#  Disabled notarization because gstreamer doesn't ship hardened runtimes so it's pointelss to try as long as we're bundling gstreamer
#    - name: "Notarize Release Build"
#      uses: devbotsxyz/xcode-notarize@v1
#      with:
#        product-path: ${{ github.workspace }}/build/${{ env.installer_fn }}
#        primary-bundle-id: org.openkj.openkj
#        appstore-connect-username: ${{ secrets.APPLE_APP_STORE_CONNECT_USER }}
#        appstore-connect-password: ${{ secrets.APPLE_APP_STORE_CONNECT_PASS }}

#    - name: "Staple Release Build"
#      uses: devbotsxyz/xcode-staple@v1
#      with:
#        product-path: ${{ github.workspace }}/build/${{ env.installer_fn }}

    - name: Release
      uses: softprops/action-gh-release@v2
      if: steps.get_version.outputs.is-semver == 'true'
      with:
        files: ${{ github.workspace }}/build/${{ env.installer_fn }}
        prerelease: ${{ env.rtype != 'release' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
