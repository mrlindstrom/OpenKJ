# Fork build: compiles OpenKJ for macOS on every push and publishes a GitHub release
# when a version tag (e.g. 1.2.3) is pushed.  Based on the upstream macOS workflow, with
# the Apple code signing and openkj.org upload steps removed, so the output is unsigned.
name: Fork macOS Build

on:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to attach the installer to, replacing any installer already there (e.g. 2.2.0). Leave blank to just build.'
        required: false
        default: ''
      sanitize:
        description: 'Build with AddressSanitizer for crash debugging. Slower; produces an app artifact only, never a release.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fork macOS Build
    # Pinned rather than macos-latest: the Xcode 21 toolchain on the current image
    # rejects the consteval usage in the fmt version vendored with spdlog 1.9.2.
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: lukka/get-cmake@latest

    - name: Get version from git tag
      id: get_version
      uses: dhkatz/get-version-action@v3.0.0

    - name: Get OpenKJ version being buit
      run: |
        if [ "${{ steps.get_version.outputs.prerelease }}" = "" ];then
          RTYPE="release"
          BRANCH="release"
        elif [ "${{ steps.get_version.outputs.prerelease }}" = "unstable" ];then
          RTYPE="unstable"
          BRANCH="unstable"
        else
          RTYPE=${{ steps.get_version.outputs.prerelease }}
          BRANCH="unstable"
        fi
        OKJVER=${{ steps.get_version.outputs.version-without-v }}
        if [ -n "${{ inputs.release_tag }}" ]; then
          OKJVER="${{ inputs.release_tag }}"
          OKJVER="${OKJVER#v}"
        fi
        FN="OpenKJ-${OKJVER}-osx-installer.pkg"
        echo "installer_fn=${FN}" >> $GITHUB_ENV
        echo "rtype=${RTYPE}" >> $GITHUB_ENV
        echo "branch=${BRANCH}" >> $GITHUB_ENV

    - name: Update files with new version info
      if: steps.get_version.outputs.is-semver == 'true'
      run: |
        MAJOR=${{ steps.get_version.outputs.major }}
        MINOR=${{ steps.get_version.outputs.minor }}
        PATCH=${{ steps.get_version.outputs.patch }}
        BRANCH=${{ env.rtype }}

        echo "Updating okjversion.h"
        echo "#ifndef OKJVERSION_H" > src/okjversion.h
        echo "#define OKJVERSION_H" >> src/okjversion.h
        echo >> src/okjversion.h
        echo "#define OKJ_VERSION_MAJOR ${{ steps.get_version.outputs.major }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_MINOR ${{ steps.get_version.outputs.minor }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_BUILD ${{ steps.get_version.outputs.patch }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_STRING \"${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}.${{ steps.get_version.outputs.patch }}\"" >> src/okjversion.h
        echo "#define OKJ_VERSION_BRANCH \"${{ env.rtype }}\"" >> src/okjversion.h
        echo >> src/okjversion.h
        echo "#endif //OKJVERSION_H" >> src/okjversion.h
      shell: bash

    - name: install deps
      run: |
        brew install cmake ninja pkgconf cppunit utf8cpp qt@5

    # The osxrelocator package on PyPI is Python 2 only and won't run under the runner's
    # Python 3, so use the small equivalent kept in .github/scripts instead.
    - name: Install osxrelocator replacement
      run: |
        sudo install -m 0755 .github/scripts/osxrelocator /usr/local/bin/osxrelocator
        osxrelocator 2>&1 | head -1 || true

    # Build against GStreamer's own macOS framework rather than the Homebrew formula, so the
    # framework can be copied into the .app and the result runs on Macs without GStreamer.
    - name: Install GStreamer framework
      env:
        GST_VERSION: '1.28.7'
      run: |
        curl -sSfL -o gstreamer.pkg "https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}/gstreamer-1.0-${GST_VERSION}-universal.pkg"
        curl -sSfL -o gstreamer-devel.pkg "https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}/gstreamer-1.0-devel-${GST_VERSION}-universal.pkg"
        sudo installer -pkg gstreamer.pkg -target /
        sudo installer -pkg gstreamer-devel.pkg -target /
        ls -l /Library/Frameworks/GStreamer.framework/Versions/

    # The build copies GStreamer.framework.dist into the bundle.  Make that copy here, without
    # the development files, so the shipped app stays a reasonable size.
    - name: Prepare GStreamer framework copy for bundling
      run: |
        sudo cp -R /Library/Frameworks/GStreamer.framework /Library/Frameworks/GStreamer.framework.dist
        du -sh /Library/Frameworks/GStreamer.framework.dist
        # Only drop things nothing loads at runtime.  Headers stay: deleting them leaves the
        # framework's root symlinks dangling, which makes codesign reject the bundle.
        sudo find /Library/Frameworks/GStreamer.framework.dist -name '*.a' -delete
        sudo find /Library/Frameworks/GStreamer.framework.dist -name '*.la' -delete
        sudo rm -rf /Library/Frameworks/GStreamer.framework.dist/Versions/1.0/share/gtk-doc
        sudo rm -rf /Library/Frameworks/GStreamer.framework.dist/Versions/1.0/share/man
        du -sh /Library/Frameworks/GStreamer.framework.dist

    - name: Build
      env:
        LDFLAGS: "-L/opt/homebrew/opt/qt@5/lib"
        CPPFLAGS: "-I/opt/homebrew/opt/qt@5/include"
        PKG_CONFIG_PATH: "/Library/Frameworks/GStreamer.framework/Versions/1.0/lib/pkgconfig:/opt/homebrew/opt/qt@5/lib/pkgconfig"
        QT_DIR: "/opt/homebrew/opt/qt@5/"
        Qt5_DIR: "/opt/homebrew/opt/qt@5/"
      run: |
        if [ "${{ inputs.sanitize }}" = "true" ]; then
          echo "Building with AddressSanitizer"
          cmake -DSPDLOG_USE_BUNDLED=true -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUNDLE_GSTREAMER=True \
                -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
                -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
                . -B build -G Ninja
        else
          cmake -DSPDLOG_USE_BUNDLED=true -DCMAKE_BUILD_TYPE=Release -DBUNDLE_GSTREAMER=True . -B build -G Ninja
        fi
        ninja -C build

    # The sanitizer runtime is loaded by @rpath, which doesn't resolve inside a bundle, so copy
    # it in and point the executable at the copy.
    - name: Bundle the AddressSanitizer runtime
      if: inputs.sanitize == true
      working-directory: ${{github.workspace}}/build
      run: |
        ASAN_LIB=$(find "$(dirname "$(xcrun --find clang)")/../lib/clang" -name 'libclang_rt.asan_osx_dynamic.dylib' | head -1)
        echo "Using $ASAN_LIB"
        cp "$ASAN_LIB" openkj.app/Contents/Frameworks/
        install_name_tool -change "@rpath/libclang_rt.asan_osx_dynamic.dylib" \
          "@executable_path/../Frameworks/libclang_rt.asan_osx_dynamic.dylib" \
          openkj.app/Contents/MacOS/openkj
        otool -L openkj.app/Contents/MacOS/openkj | grep asan

    # macdeployqt and the relocator rewrite Mach-O headers with install_name_tool, which
    # invalidates the files' code signatures, and macOS on Apple Silicon kills any process that
    # loads a binary with an invalid signature.  So re-sign every Mach-O file individually,
    # longest paths first so nested code is signed before whatever contains it, then seal the
    # bundles.  Sealing the GStreamer framework can fail because of its layout; the files inside
    # are already signed, which is what the loader checks, so that isn't fatal.
    - name: Ad-hoc sign the app bundle
      working-directory: ${{github.workspace}}/build
      run: |
        # The GStreamer copy comes from a root-owned framework copied with permissions preserved;
        # codesign can't rewrite read-only files and reports it as an "internal error".
        chmod -R u+w openkj.app
        # GStreamer's package ships a stray .gitignore at the framework root.  A framework root may
        # only hold symlinks and Versions/, so that one file stops the framework being sealed.
        find openkj.app/Contents/Frameworks/GStreamer.framework -maxdepth 1 -type f -print -delete
        signed=0
        while IFS= read -r f; do
          if file "$f" | grep -q 'Mach-O'; then
            codesign --force --sign - "$f"
            signed=$((signed + 1))
          fi
        done < <(find openkj.app/Contents -type f | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)
        echo "signed $signed Mach-O files"
        for fw in openkj.app/Contents/Frameworks/*.framework; do
          codesign --force --sign - "$fw"
        done
        codesign --force --sign - openkj.app
        codesign --verify --strict --verbose=1 openkj.app

        # Also check each library's own signature, which is what macOS enforces when loading code,
        # so a bad file is named in the log rather than hidden behind a bundle-level error.
        bad=0
        while IFS= read -r f; do
          if file "$f" | grep -q 'Mach-O'; then
            codesign --verify "$f" 2>/dev/null || { echo "INVALID signature: $f"; bad=$((bad + 1)); }
          fi
        done < <(find openkj.app/Contents/Frameworks openkj.app/Contents/PlugIns -type f)
        codesign --display --verbose=1 openkj.app/Contents/MacOS/openkj
        if [ "$bad" -gt 0 ]; then
          echo "$bad file(s) have invalid signatures"
          exit 1
        fi
        echo "all library signatures valid"

    # The bundled framework's libraries use @rpath install names, so the only thing that has to be
    # rewritten is the executable's rpath.  Check that nothing still points at the system copy,
    # which is what would make the app fail on a Mac without GStreamer installed.
    - name: Check the app bundle is self-contained
      working-directory: ${{github.workspace}}/build
      run: |
        echo "rpaths in the app executable:"
        otool -l openkj.app/Contents/MacOS/openkj | grep -A2 LC_RPATH | grep 'path ' || true
        echo
        echo "files still referencing the system GStreamer framework:"
        if grep -rl --binary-files=text '/Library/Frameworks/GStreamer' openkj.app/Contents/MacOS openkj.app/Contents/Frameworks 2>/dev/null; then
          echo "WARNING: the app may need GStreamer installed to run"
        else
          echo "none - bundle looks self-contained"
        fi

    - name: Upload app
      uses: actions/upload-artifact@v4
      with:
        path: build/openkj.app
        name: ${{ inputs.sanitize == true && 'openkj-asan.app' || 'openkj.app' }}

    - name: Create installer
      if: inputs.sanitize != true
      working-directory: ${{github.workspace}}/build
      run: |
        mkdir -p fakeroot/Applications
        mv "openkj.app" fakeroot/Applications/OpenKJ.app
        pkgbuild --root "fakeroot" --component-plist ../macos/openkj.plist --identifier "org.openkj.openkj" ${{ env.installer_fn }}

#  Disabled notarization because gstreamer doesn't ship hardened runtimes so it's pointelss to try as long as we're bundling gstreamer
#    - name: "Notarize Release Build"
#      uses: devbotsxyz/xcode-notarize@v1
#      with:
#        product-path: ${{ github.workspace }}/build/${{ env.installer_fn }}
#        primary-bundle-id: org.openkj.openkj
#        appstore-connect-username: ${{ secrets.APPLE_APP_STORE_CONNECT_USER }}
#        appstore-connect-password: ${{ secrets.APPLE_APP_STORE_CONNECT_PASS }}

#    - name: "Staple Release Build"
#      uses: devbotsxyz/xcode-staple@v1
#      with:
#        product-path: ${{ github.workspace }}/build/${{ env.installer_fn }}

    - name: Upload installer
      if: inputs.sanitize != true
      uses: actions/upload-artifact@v4
      with:
        path: build/${{ env.installer_fn }}
        name: ${{ env.installer_fn }}

    # Manual runs with a release_tag replace the installer on that existing release, so a fixed
    # build can be swapped in without re-tagging.  --clobber overwrites a same-named asset.
    - name: Attach installer to existing release
      if: inputs.release_tag != '' && inputs.sanitize != true
      working-directory: ${{github.workspace}}/build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" > /dev/null
        gh release upload "${{ inputs.release_tag }}" "${{ env.installer_fn }}" --clobber --repo "${{ github.repository }}"
        echo "Attached ${{ env.installer_fn }} to release ${{ inputs.release_tag }}"

    - name: Release
      uses: softprops/action-gh-release@v2
      if: steps.get_version.outputs.is-semver == 'true' && inputs.sanitize != true
      with:
        files: ${{ github.workspace }}/build/${{ env.installer_fn }}
        prerelease: ${{ env.rtype != 'release' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
